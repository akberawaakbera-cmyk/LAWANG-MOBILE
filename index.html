<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>LAWANG MOBILE</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #10151c;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #18212b;
    }

    #ui {
      position: fixed;
      top: 15px;
      left: 15px;

      z-index: 10;

      color: white;

      background: rgba(0, 0, 0, 0.55);

      padding: 10px 14px;

      border-radius: 10px;

      font-size: 14px;

      line-height: 1.6;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <canvas id="game"></canvas>

  <div id="ui">
    <strong>LAWANG MOBILE</strong><br>

    HP:
    <span id="hp">100</span>
    <br>

    Weapon:
    <span id="weapon">PISTOL</span>
    <br>

    Score:
    <span id="score">0</span>
  </div>

  <!-- Game Engine -->
  <script src="game.js"></script>

</body>
</html>
