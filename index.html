<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <title>LAWANG MOBILE</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #10151c;
      font-family: Arial, sans-serif;
    }
    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #18212b;
    }
    #ui {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 10;
      color: white;
      background: rgba(0, 0, 0, 0.55);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
    }
    #controls {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }
    .button {
      position: absolute;
      width: 65px;
      height: 65px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      color: white;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: auto;
    }
    #up {
      left: 90px;
      bottom: 145px;
    }
    #down {
      left: 90px;
      bottom: 20px;
    }
    #left {
      left: 20px;
      bottom: 82px;
    }
    #right {
      left: 160px;
      bottom: 82px;
    }
    #fire {
      right: 25px;
      bottom: 55px;
      width: 90px;
      height: 90px;
      background: rgba(220, 50, 50, 0.35);
      font-size: 18px;
    }
    #switch {
      right: 135px;
      bottom: 75px;
      width: 65px;
      height: 65px;
      font-size: 13px;
    }
    @media (orientation: landscape) {
      #up {
        bottom: 125px;
      }
      #down {
        bottom: 15px;
      }
      #left {
        bottom: 70px;
      }
      #right {
        bottom: 70px;
      }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <strong>LAWANG MOBILE</strong><br>
    HP: <span id="hp">100</span><br>
    Weapon: <span id="weapon">PISTOL</span><br>
    Score: <span id="score">0</span>
  </div>
  <div id="controls">
    <div class="button" id="up">▲</div>
    <div class="button" id="down">▼</div>
    <div class="button" id="left">◀</div>
    <div class="button" id="right">▶</div>
    <div class="button" id="switch">
      GUN
    </div>
    <div class="button" id="fire">
      FIRE
    </div>
  </div>
  <!-- Game engine -->
  <script src="game.js"></script>
</body>
</html>
